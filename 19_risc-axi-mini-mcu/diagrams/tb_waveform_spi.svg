<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <style>
      .sig { stroke: #0f172a; stroke-width: 2.5; fill: none; stroke-linejoin: round; }
      .bg { fill: transparent; }
      .text-label { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .text-small { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .text-white { font-family: 'Noto Sans KR', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; }
      .fill-data { fill: #eaeded; stroke: #0f172a; stroke-width: 1.5; }
      .fill-irq { fill: #0f2b5b; stroke: #0f2b5b; stroke-width: 1.5; }
      .dash { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6,6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
  </defs>
  
  <rect width="100%" height="100%" class="bg" />

  <!-- Vertical Phase Lines -->
  <line x1="280" y1="30" x2="280" y2="340" class="dash" />
  <line x1="480" y1="30" x2="480" y2="340" class="dash" />
  <line x1="680" y1="30" x2="680" y2="340" class="dash" />

  <!-- Phase Labels -->
  <text x="200" y="25" class="text-label" text-anchor="middle" fill="#0f2b5b">1. UART RX</text>
  <text x="380" y="25" class="text-label" text-anchor="middle" fill="#0f2b5b">2. DMA RX DONE</text>
  <text x="580" y="25" class="text-label" text-anchor="middle" fill="#0f2b5b">3. PLIC IRQ (Core)</text>
  <text x="780" y="25" class="text-label" text-anchor="middle" fill="#0f2b5b">4. SPI TX</text>

  <!-- Signal: UART RX -->
  <text x="20" y="75" class="text-label">UART_RX</text>
  <path d="M 140 70 L 160 70 L 170 55 L 250 55 L 260 70 L 880 70" class="sig" />
  <path d="M 160 70 L 170 85 L 250 85 L 260 70" class="sig" />
  <rect x="170" y="55" width="80" height="30" class="fill-data" />
  <text x="210" y="75" class="text-small" text-anchor="middle">Bytes</text>

  <!-- Signal: DMA RX TVALID -->
  <text x="20" y="125" class="text-label">DMA_RX_VALID</text>
  <path d="M 140 120 L 170 120 L 170 95 L 250 95 L 250 120 L 880 120" class="sig" />
  
  <!-- Signal: DMA DONE IRQ -->
  <text x="20" y="175" class="text-label">DMA_DONE_IRQ</text>
  <path d="M 140 170 L 260 170 L 260 145 L 450 145 L 450 170 L 880 170" class="sig" />
  
  <!-- Signal: CPU EXECUTING -->
  <text x="20" y="225" class="text-label">CPU_STATE</text>
  <path d="M 140 220 L 460 220 L 470 205 L 650 205 L 660 220 L 880 220" class="sig" />
  <path d="M 460 220 L 470 235 L 650 235 L 660 220" class="sig" />
  <rect x="470" y="205" width="180" height="30" class="fill-irq" />
  <text x="560" y="225" class="text-white" text-anchor="middle">PLIC Claim=6 Handler</text>

  <!-- Signal: DMA TX TVALID -->
  <text x="20" y="275" class="text-label">DMA_TX_VALID</text>
  <path d="M 140 270 L 670 270 L 670 245 L 810 245 L 810 270 L 880 270" class="sig" />

  <!-- Signal: SPI MOSI -->
  <text x="20" y="325" class="text-label">SPI_MOSI</text>
  <path d="M 140 320 L 690 320 L 700 305 L 830 305 L 840 320 L 880 320" class="sig" />
  <path d="M 690 320 L 700 335 L 830 335 L 840 320" class="sig" />
  <rect x="700" y="305" width="130" height="30" class="fill-data" />
  <text x="765" y="325" class="text-small" text-anchor="middle">Pixel Output</text>

  <!-- Causal Arrows -->
  <path d="M 255 157 L 275 157" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 455 220 L 475 220" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 665 257 L 685 257" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  
</svg>
