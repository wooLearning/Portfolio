<svg xmlns="http://www.w3.org/2000/svg" width="950" height="600" viewBox="0 0 950 600" style="background:#ffffff; font-family: 'Noto Sans KR', Arial, sans-serif;">
  <defs>
    <style>
      .line { fill: none; stroke: #0f172a; stroke-width: 1.5; stroke-linejoin: round; }
      .bus-line { fill: none; stroke: #0f172a; stroke-width: 3; stroke-linejoin: round; }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .dash-box { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10,6; }
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; rx: 4; }
      .box-highlight { fill: #f1f5f9; stroke: #0f2b5b; stroke-width: 2; rx: 4; }
      .mux { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; stroke-linejoin: round; }
      .text-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text-bold { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 13px; fill: #334155; }
      .text-small { font-size: 12px; font-weight: 600; fill: #64748b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowBus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <text x="475" y="40" class="text-title" text-anchor="middle">Figure 5. PLIC (Platform-Level Interrupt Controller) Architecture</text>

  <rect x="80" y="80" width="830" height="460" class="dash-box" />
  <text x="90" y="105" class="text-bold">PLIC-lite Core</text>

  <!-- Left: Interrupt Sources -->
  <path d="M 10 180 L 100 180" class="line" marker-end="url(#arrow)" />
  <text x="45" y="170" class="text-bold" text-anchor="middle">ID 1-4</text>
  <text x="45" y="195" class="text-small" text-anchor="middle">(UART/SPI)</text>

  <path d="M 10 280 L 100 280" class="line" marker-end="url(#arrow)" />
  <text x="45" y="270" class="text-bold" text-anchor="middle">ID 6</text>
  <text x="45" y="295" class="text-small" text-anchor="middle">(DMA_DONE)</text>

  <path d="M 10 380 L 100 380" class="line" marker-end="url(#arrow)" />
  <text x="45" y="370" class="text-bold" text-anchor="middle">ID 7</text>
  <text x="45" y="395" class="text-small" text-anchor="middle">(DMA_ERROR)</text>

  <text x="45" y="340" class="text-bold" text-anchor="middle">...</text>

  <!-- Gateways & IP -->
  <rect x="100" y="130" width="100" height="300" class="box" />
  <text x="150" y="160" class="text-bold" text-anchor="middle">Gateway</text>
  <text x="150" y="180" class="text-bold" text-anchor="middle">&amp; IP Array</text>
  <text x="150" y="200" class="text-small" text-anchor="middle">(Pending Bits)</text>
  
  <rect x="120" y="220" width="60" height="30" class="box-highlight" />
  <text x="150" y="240" class="text-small" text-anchor="middle">IP[1-4]</text>
  
  <rect x="120" y="270" width="60" height="30" class="box-highlight" />
  <text x="150" y="290" class="text-small" text-anchor="middle">IP[6]</text>
  
  <rect x="120" y="320" width="60" height="30" class="box-highlight" />
  <text x="150" y="340" class="text-small" text-anchor="middle">IP[7]</text>

  <!-- Enable Array & Priorities -->
  <rect x="260" y="130" width="120" height="300" class="box" />
  <text x="320" y="160" class="text-bold" text-anchor="middle">IE Array</text>
  <text x="320" y="180" class="text-small" text-anchor="middle">(Enable Bits)</text>
  
  <rect x="280" y="220" width="80" height="30" class="box-highlight" />
  <text x="320" y="240" class="text-small" text-anchor="middle">IE[1-4] &amp; PRI</text>
  
  <rect x="280" y="270" width="80" height="30" class="box-highlight" />
  <text x="320" y="290" class="text-small" text-anchor="middle">IE[6] &amp; PRI[6]</text>
  
  <rect x="280" y="320" width="80" height="30" class="box-highlight" />
  <text x="320" y="340" class="text-small" text-anchor="middle">IE[7] &amp; PRI[7]</text>

  <!-- Routing from IP to IE -->
  <path d="M 200 235 L 260 235" class="line" marker-end="url(#arrow)" />
  <path d="M 200 285 L 260 285" class="line" marker-end="url(#arrow)" />
  <path d="M 200 335 L 260 335" class="line" marker-end="url(#arrow)" />

  <!-- Target 0 Arbiter -->
  <rect x="460" y="130" width="180" height="300" class="box-highlight" />
  <text x="550" y="160" class="text-bold" text-anchor="middle">Priority Arbiter</text>
  <text x="550" y="180" class="text-bold" text-anchor="middle">(Target 0 : Machine)</text>
  
  <polygon points="480,200 620,240 620,330 480,370" class="mux" />
  <text x="550" y="275" class="text-bold" text-anchor="middle">Max()</text>
  <text x="550" y="295" class="text-small" text-anchor="middle">Select Max</text>
  <text x="550" y="315" class="text-small" text-anchor="middle">Priority ID</text>

  <rect x="500" y="395" width="100" height="25" class="box" />
  <text x="550" y="412" class="text-small" text-anchor="middle">Threshold</text>
  <path d="M 550 395 L 550 350" class="line" marker-end="url(#arrow)" />

  <!-- Routing to Arbiter -->
  <path d="M 380 235 L 480 235" class="line" marker-end="url(#arrow)" />
  <path d="M 380 285 L 480 285" class="line" marker-end="url(#arrow)" />
  <path d="M 380 335 L 480 335" class="line" marker-end="url(#arrow)" />

  <!-- Output MEIP -->
  <path d="M 620 280 L 950 280" class="line" marker-end="url(#arrow)" />
  <text x="800" y="270" class="text-bold" text-anchor="middle">MEIP (Machine External Interrupt)</text>
  <text x="800" y="295" class="text-small" text-anchor="middle">To RV32I Core Machine IRQ Ctrl</text>

  <!-- APB Interface at the bottom -->
  <rect x="100" y="460" width="700" height="50" class="box-highlight" />
  <text x="450" y="490" class="text-bold" text-anchor="middle">APB Slave Interface &amp; Memory-Mapped CSRs</text>

  <!-- Claim/Complete Register -->
  <rect x="680" y="320" width="120" height="60" class="box" />
  <text x="740" y="345" class="text-bold" text-anchor="middle">Claim /</text>
  <text x="740" y="365" class="text-bold" text-anchor="middle">Complete Reg</text>

  <!-- APB connection to logic -->
  <path d="M 320 460 L 320 430" class="bus-line" marker-end="url(#arrowBus)" />
  <text x="365" y="445" class="text-small" text-anchor="middle">Config R/W</text>
  
  <path d="M 550 460 L 550 420" class="bus-line" marker-end="url(#arrowBus)" />
  <path d="M 740 460 L 740 380" class="bus-line" marker-end="url(#arrowBus)" />

  <!-- Selected ID from Arbiter to Claim Reg -->
  <path d="M 620 320 L 650 320 L 650 350 L 680 350" class="bus-line" marker-end="url(#arrowBus)" />
  <text x="640" y="310" class="text-small" text-anchor="middle">ID</text>

  <!-- Complete signal from Claim Reg back to Gateway -->
  <path d="M 740 320 L 740 115 L 150 115 L 150 130" class="dashed" marker-end="url(#arrow)" />
  <text x="445" y="105" class="text-small" text-anchor="middle">Clear Pending Bit (Complete)</text>

</svg>
