<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900">
  <defs>
    <!-- Solid Arrowhead for thin lines -->
    <marker id="solidArrow" orient="auto" markerWidth="6" markerHeight="6" refX="6" refY="3">
      <path d="M0,0 L6,3 L0,6 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">Figure 1. RISC-V AXI SoC performance line block diagram</text>

  <!-- Outer Boundary -->
  <rect x="10" y="40" width="1080" height="840" fill="none" stroke="#000000" stroke-width="1.5"/>

  <!-- Clock & Power removed per user request -->

  <!-- Core Box with Stages -->
  <rect x="150" y="100" width="280" height="300" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="15"/>
  <text x="290" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#000000" text-anchor="middle">RV32 Pipeline Core</text>

  <!-- Stage IF -->
  <rect x="175" y="150" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="195" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">IF</text>

  <!-- Stage ID -->
  <rect x="225" y="150" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="245" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">ID</text>

  <!-- Stage EX -->
  <rect x="275" y="150" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="295" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">EX</text>

  <!-- Stage MEM -->
  <rect x="325" y="150" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="345" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">MEM</text>

  <!-- Stage WB -->
  <rect x="375" y="150" width="40" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="395" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">WB</text>

  <!-- RegFile -->
  <rect x="215" y="210" width="70" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="250" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">RegFile</text>

  <!-- CSR File -->
  <rect x="315" y="210" width="70" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="350" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">CSR File</text>

  <!-- Hazard & Forwarding Unit -->
  <rect x="175" y="270" width="240" height="35" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="295" y="292" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Hazard &amp; Forwarding Unit</text>

  <!-- Trap Controller Area -->
  <path d="M 150,360 L 430,360" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="290" y="385" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Trap Controller</text>

  <!-- ICode ROM -->
  <rect x="470" y="100" width="100" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="520" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">ICode ROM</text>
  <text x="520" y="145" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle">Local Bus</text>

  <!-- IBus Double Arrow -->
  <path d="M 440,126 L 460,126 L 460,122 L 470,130 L 460,138 L 460,134 L 440,134 L 440,138 L 430,130 L 440,122 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="450" y="120" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle">IBus</text>

  <!-- AXI Adapter -->
  <rect x="470" y="200" width="90" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="515" y="225" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">AXI</text>
  <text x="515" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Adapter</text>

  <!-- DBus Double Arrow -->
  <path d="M 440,226 L 460,226 L 460,222 L 470,230 L 460,238 L 460,234 L 440,234 L 440,238 L 430,230 L 440,222 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="450" y="220" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="middle">DBus</text>

  <!-- AXI Interconnect -->
  <rect x="600" y="80" width="40" height="340" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="620" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle" transform="rotate(-90 620,250)">AXI-Lite Interconnect</text>

  <!-- Adapter to Interconnect Double Arrow -->
  <path d="M 570,226 L 590,226 L 590,222 L 600,230 L 590,238 L 590,234 L 570,234 L 570,238 L 560,230 L 570,222 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <!-- AXI Slaves -->
  <rect x="700" y="130" width="120" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="760" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">AXI ROM</text>
  <path d="M 650,156 L 690,156 L 690,152 L 700,160 L 690,168 L 690,164 L 650,164 L 650,168 L 640,160 L 650,152 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <rect x="700" y="250" width="120" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="760" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">AXI SRAM</text>
  <path d="M 650,276 L 690,276 L 690,272 L 700,280 L 690,288 L 690,284 L 650,284 L 650,288 L 640,280 L 650,272 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <rect x="700" y="350" width="120" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="760" y="385" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">AXI to APB Bridge</text>
  <path d="M 650,376 L 690,376 L 690,372 L 700,380 L 690,388 L 690,384 L 650,384 L 650,388 L 640,380 L 650,372 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <!-- APB Bus -->
  <rect x="725" y="440" width="30" height="420" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="745" y="650" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle" transform="rotate(-90 745,650)">APB Bus</text>
  <!-- Bridge to APB Single Down Arrow -->
  <path d="M 736,410 L 736,430 L 732,430 L 740,440 L 748,430 L 744,430 L 744,410 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <!-- APB Peripherals (Left) -->
  <rect x="560" y="450" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="620" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Timer</text>
  <path d="M 690,471 L 715,471 L 715,467 L 725,475 L 715,483 L 715,479 L 690,479 L 690,483 L 680,475 L 690,467 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <rect x="560" y="530" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="620" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">PLIC</text>
  <path d="M 690,551 L 715,551 L 715,547 L 725,555 L 715,563 L 715,559 L 690,559 L 690,563 L 680,555 L 690,547 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <rect x="560" y="610" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="620" y="640" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">GPIOA</text>
  <path d="M 690,631 L 715,631 L 715,627 L 725,635 L 715,643 L 715,639 L 690,639 L 690,643 L 680,635 L 690,627 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <rect x="560" y="690" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="620" y="720" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">GPIOB</text>
  <path d="M 690,711 L 715,711 L 715,707 L 725,715 L 715,723 L 715,719 L 690,719 L 690,723 L 680,715 L 690,707 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <rect x="560" y="770" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="620" y="800" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">GPIOC</text>
  <path d="M 690,791 L 715,791 L 715,787 L 725,795 L 715,803 L 715,799 L 690,799 L 690,803 L 680,795 L 690,787 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <!-- APB Peripherals (Right) -->
  <rect x="800" y="450" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="860" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">SPI</text>
  <path d="M 765,471 L 790,471 L 790,467 L 800,475 L 790,483 L 790,479 L 765,479 L 765,483 L 755,475 L 765,467 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <rect x="800" y="530" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="860" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">I2C</text>
  <path d="M 765,551 L 790,551 L 790,547 L 800,555 L 790,563 L 790,559 L 765,559 L 765,563 L 755,555 L 765,547 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <rect x="800" y="610" width="120" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="860" y="640" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">UART</text>
  <path d="M 765,631 L 790,631 L 790,627 L 800,635 L 790,643 L 790,639 L 765,639 L 765,643 L 755,635 L 765,627 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>

  <!-- External Pins Out (Left) -->
  <path d="M 490,631 L 550,631 L 550,627 L 560,635 L 550,643 L 550,639 L 490,639 L 490,643 L 480,635 L 490,627 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 20,635 L 480,635" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="470" y="630" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="end">PA[15:0] (iSw, oLed)</text>

  <path d="M 490,711 L 550,711 L 550,707 L 560,715 L 550,723 L 550,719 L 490,719 L 490,723 L 480,715 L 490,707 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 20,715 L 480,715" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="470" y="710" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="end">PB[15:0] (ioGpioB)</text>

  <path d="M 490,791 L 550,791 L 550,787 L 560,795 L 550,803 L 550,799 L 490,799 L 490,803 L 480,795 L 490,787 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 20,795 L 480,795" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="470" y="790" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="end">PC[3:0] (iBtn)</text>

  <!-- External Pins Out (Right) -->
  <path d="M 930,471 L 970,471 L 970,467 L 980,475 L 970,483 L 970,479 L 930,479 L 930,483 L 920,475 L 930,467 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 980,475 L 1070,475" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="990" y="470" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="start">SPI (MISO, MOSI, SCK, CS)</text>

  <path d="M 930,551 L 970,551 L 970,547 L 980,555 L 970,563 L 970,559 L 930,559 L 930,563 L 920,555 L 930,547 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 980,555 L 1070,555" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="990" y="550" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="start">I2C (SDA, SCL)</text>

  <path d="M 930,631 L 970,631 L 970,627 L 980,635 L 970,643 L 970,639 L 930,639 L 930,643 L 920,635 L 930,627 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <path d="M 980,635 L 1070,635" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="990" y="630" font-family="Arial, sans-serif" font-size="12" fill="#000000" text-anchor="start">UART (RX, TX)</text>

  <!-- Interrupt Lines (Extending Left) -->
  <!-- Timer -> Trap Ctrl -->
  <path d="M 560,475 L 340,475 L 340,400" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#solidArrow)"/>
  <!-- PLIC -> Trap Ctrl -->
  <path d="M 560,555 L 380,555 L 380,400" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#solidArrow)"/>

</svg>
