<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="490" viewBox="0 0 1400 490" role="img">
<title>TX request FSM, all transitions from implemented RTL</title><rect width="100%" height="100%" fill="white"/>
<text x="35" y="52" fill="#16324f" font-family="Malgun Gothic, sans-serif" font-size="32" font-weight="700" text-anchor="start">TX 제어 FSM</text>
<text x="35" y="90" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" text-anchor="start">can_tx_ctrl · rCurState / wNxtState · state / next-state / output의 3블록</text>
<rect x="135" y="205" width="260" height="110" rx="10" fill="#eef5fd" stroke="#1765c1" stroke-width="2"/>
<text x="265" y="249" fill="#16324f" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" text-anchor="middle">IDLE</text>
<text x="265" y="287" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" text-anchor="middle">valid = 0</text>
<rect x="570" y="205" width="260" height="110" rx="10" fill="#eef5fd" stroke="#1765c1" stroke-width="2"/>
<text x="700" y="249" fill="#16324f" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" text-anchor="middle">SEND</text>
<text x="700" y="287" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" text-anchor="middle">valid = 1</text>
<rect x="1010" y="205" width="260" height="110" rx="10" fill="#eef5fd" stroke="#1765c1" stroke-width="2"/>
<text x="1140" y="249" fill="#16324f" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700" text-anchor="middle">WAIT_DONE</text>
<text x="1140" y="287" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" text-anchor="middle">valid = 0</text>
<polyline points="35,255 135,255" fill="none" stroke="#1765c1" stroke-width="3"/>
<polyline points="124.19463477176788,260.21958640933474 135,255 124.19463477176788,249.78041359066523" fill="none" stroke="#1765c1" stroke-width="3"/>
<text x="38" y="237" fill="#16324f" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" text-anchor="start">reset</text>
<polyline points="395,245 570,245" fill="none" stroke="#1765c1" stroke-width="3"/>
<polyline points="559.1946347717678,250.21958640933477 570,245 559.1946347717678,239.78041359066523" fill="none" stroke="#1765c1" stroke-width="3"/>
<text x="482" y="223" fill="#16324f" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" text-anchor="middle">FIFO nonempty</text>
<polyline points="830,245 1010,245" fill="none" stroke="#1765c1" stroke-width="3"/>
<polyline points="999.1946347717678,250.21958640933477 1010,245 999.1946347717678,239.78041359066523" fill="none" stroke="#1765c1" stroke-width="3"/>
<text x="920" y="213" fill="#16324f" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" text-anchor="middle">ready &amp; !done</text>
<text x="920" y="286" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" text-anchor="middle">pop head</text>
<polyline points="1140,315 1140,410 265,410 265,315" fill="none" stroke="#008b83" stroke-width="3"/>
<polyline points="270.21958640933474,325.8053652282321 265,315 259.78041359066526,325.8053652282321" fill="none" stroke="#008b83" stroke-width="3"/>
<text x="720" y="441" fill="#008b83" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" text-anchor="middle">done → success / error event</text>
<polyline points="700,205 700,150 265,150 265,205" fill="none" stroke="#008b83" stroke-width="3"/>
<polyline points="259.78041359066526,194.19463477176788 265,205 270.21958640933474,194.19463477176788" fill="none" stroke="#008b83" stroke-width="3"/>
<text x="483" y="135" fill="#008b83" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" text-anchor="middle">ready &amp; done → pop + completion</text>
<text x="265" y="357" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" text-anchor="middle">empty → hold</text>
<text x="700" y="357" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" text-anchor="middle">!ready → hold frame</text>
<text x="1140" y="357" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" text-anchor="middle">!done → hold</text>
<text x="35" y="475" fill="#576b80" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">Reset applies to every state. One outstanding request; no completion timeout.</text>
</svg>