<svg xmlns="http://www.w3.org/2000/svg" width="940" height="468" viewBox="0 0 940 468" style="background:#ffffff; font-family: 'Noto Sans KR', Arial, sans-serif;">
  <defs>
    <style>
      .line { fill: none; stroke: #0f172a; stroke-width: 1.5; stroke-linejoin: round; }
      .bus-line { fill: none; stroke: #0f172a; stroke-width: 3; stroke-linejoin: round; }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .dash-box { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10,6; }
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; rx: 4; }
      .box-highlight { fill: #f1f5f9; stroke: #0f2b5b; stroke-width: 2; rx: 4; }
      .text-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text-bold { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 13px; fill: #334155; }
      .text-small { font-size: 12px; font-weight: 600; fill: #64748b; }
      .lane-title { font-size: 14px; font-weight: 700; fill: #0f2b5b; letter-spacing: 0.5px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowBus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="470" y="40" class="text-title" text-anchor="middle">Figure 3. System Data and Control Flow Separation</text>
  <text x="470" y="60" class="text" text-anchor="middle">CPU handles configuration (Control Path), while DMA moves payload (Data Path)</text>

  <!-- Lane 1: Control Path -->
  <rect x="24" y="90" width="892" height="100" class="dash-box"/>
  <text x="40" y="115" class="lane-title">CONTROL PATH (AXI-Lite &amp; APB)</text>

  <rect x="40" y="130" width="110" height="40" class="box"/>
  <text x="95" y="155" class="text-bold" text-anchor="middle">RV32 Core</text>

  <rect x="260" y="130" width="110" height="40" class="box"/>
  <text x="315" y="155" class="text-bold" text-anchor="middle">AXI-Lite</text>

  <rect x="460" y="130" width="110" height="40" class="box"/>
  <text x="515" y="155" class="text-bold" text-anchor="middle">APB Bridge</text>

  <rect x="680" y="130" width="220" height="40" class="box-highlight"/>
  <text x="790" y="155" class="text-bold" text-anchor="middle">Peripheral CSRs (DMA/UART/SPI)</text>

  <!-- Routing Control -->
  <path d="M 150 150 L 260 150" class="bus-line" marker-end="url(#arrowBus)"/>
  <text x="205" y="140" class="text-small" text-anchor="middle">AW/W/B, AR/R</text>

  <path d="M 370 150 L 460 150" class="bus-line" marker-end="url(#arrowBus)"/>
  <text x="415" y="140" class="text-small" text-anchor="middle">Decoded</text>

  <path d="M 570 150 L 680 150" class="bus-line" marker-end="url(#arrowBus)"/>
  <text x="625" y="140" class="text-small" text-anchor="middle">PADDR, PWDATA</text>

  <!-- Lane 2: Data Path -->
  <rect x="24" y="210" width="892" height="120" class="dash-box"/>
  <text x="40" y="235" class="lane-title">DATA PATH (AXI-Stream Payload)</text>

  <rect x="40" y="260" width="130" height="40" class="box"/>
  <text x="105" y="285" class="text-bold" text-anchor="middle">UART RX (Source)</text>

  <rect x="280" y="260" width="150" height="40" class="box-highlight"/>
  <text x="355" y="285" class="text-bold" text-anchor="middle">Stream DMA Engine</text>

  <rect x="530" y="260" width="130" height="40" class="box"/>
  <text x="595" y="285" class="text-bold" text-anchor="middle">Internal Buffer</text>

  <rect x="770" y="260" width="130" height="40" class="box"/>
  <text x="835" y="285" class="text-bold" text-anchor="middle">SPI TX (Sink)</text>

  <!-- Routing Data -->
  <path d="M 170 280 L 280 280" class="bus-line" marker-end="url(#arrowBus)"/>
  <text x="225" y="270" class="text-small" text-anchor="middle">TVALID/READY</text>

  <path d="M 430 280 L 530 280" class="bus-line" marker-end="url(#arrowBus)"/>
  <text x="480" y="270" class="text-small" text-anchor="middle">16KB Write</text>

  <path d="M 660 280 L 770 280" class="bus-line" marker-end="url(#arrowBus)"/>
  <text x="715" y="270" class="text-small" text-anchor="middle">TVALID/READY</text>

  <text x="470" y="315" class="text" text-anchor="middle">Handshake rule: Byte stream moves strictly on TVALID &amp; TREADY high, bypassing the CPU.</text>

  <!-- Lane 3: IRQ Path -->
  <rect x="24" y="350" width="892" height="90" class="dash-box"/>
  <text x="40" y="375" class="lane-title">COMPLETION PATH (Interrupt &amp; Trap)</text>

  <rect x="150" y="390" width="160" height="30" class="box"/>
  <text x="230" y="410" class="text-bold" text-anchor="middle">DMA_DONE / ERROR</text>

  <rect x="420" y="390" width="120" height="30" class="box"/>
  <text x="480" y="410" class="text-bold" text-anchor="middle">PLIC Claim</text>

  <rect x="650" y="390" width="180" height="30" class="box-highlight"/>
  <text x="740" y="410" class="text-bold" text-anchor="middle">Trap Handler (Software)</text>

  <path d="M 310 405 L 420 405" class="dashed" marker-end="url(#arrow)"/>
  <path d="M 540 405 L 650 405" class="dashed" marker-end="url(#arrow)"/>
</svg>
