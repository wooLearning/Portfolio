<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow" orient="auto" markerWidth="6" markerHeight="6" refX="5" refY="3">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0f2b5b"/>
    </marker>
    <marker id="arrowDashed" orient="auto" markerWidth="6" markerHeight="6" refX="5" refY="3">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Title -->
  <text x="500" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 6. UART-to-SPI DMA Stream Flow</text>

  <!-- Split Sections -->
  <!-- Left: Main Loop -->
  <rect x="50" y="60" width="400" height="440" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="10" />
  <text x="250" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f2b5b" text-anchor="middle">Main Thread (Polling Loop)</text>

  <!-- Right: Interrupt Handler -->
  <rect x="550" y="60" width="400" height="440" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" rx="10" />
  <text x="750" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f2b5b" text-anchor="middle">Interrupt Context (PLIC/Trap)</text>

  <!-- ================= LEFT SIDE (MAIN) ================= -->
  
  <!-- 1. Init -->
  <rect x="150" y="120" width="200" height="40" fill="#ffffff" stroke="#0f2b5b" stroke-width="2" rx="5" />
  <text x="250" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Init (Clear Flags, Set Len)</text>
  
  <path d="M 250 160 L 250 190" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. Start RX -->
  <rect x="150" y="190" width="200" height="40" fill="#eef2ff" stroke="#0f2b5b" stroke-width="2" rx="5" />
  <text x="250" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">DMA CTRL = 3 (RX Start)</text>

  <path d="M 250 230 L 250 260" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 3. Wait RX -->
  <polygon points="250,260 330,280 250,300 170,280" fill="#ffffff" stroke="#0f2b5b" stroke-width="2" />
  <text x="250" y="285" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">FLAG_DONE == 1?</text>

  <!-- Loop back for wait -->
  <path d="M 170 280 L 120 280 L 120 245 L 250 245" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="135" y="275" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">No</text>
  <text x="260" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Yes</text>

  <path d="M 250 300 L 250 340" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. Start TX -->
  <rect x="150" y="340" width="200" height="40" fill="#eef2ff" stroke="#0f2b5b" stroke-width="2" rx="5" />
  <text x="250" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">DMA CTRL = 7 (TX Start)</text>

  <path d="M 250 380 L 250 410" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5. Wait TX -->
  <polygon points="250,410 330,430 250,450 170,430" fill="#ffffff" stroke="#0f2b5b" stroke-width="2" />
  <text x="250" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">FLAG_DONE == 1?</text>

  <path d="M 170 430 L 120 430 L 120 395 L 250 395" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="135" y="425" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">No</text>
  <text x="260" y="470" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Yes</text>

  <path d="M 250 450 L 250 480 L 80 480 L 80 140 L 150 140" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />


  <!-- ================= RIGHT SIDE (IRQ) ================= -->
  
  <!-- Trigger Event -->
  <rect x="650" y="120" width="200" height="40" fill="#fecaca" stroke="#ef4444" stroke-width="2" rx="20" />
  <text x="750" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Hardware DMA_DONE</text>

  <path d="M 750 160 L 750 190" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Trap Entry -->
  <rect x="650" y="190" width="200" height="40" fill="#ffffff" stroke="#0f2b5b" stroke-width="2" rx="5" />
  <text x="750" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">mtvec Direct Trap Entry</text>

  <path d="M 750 230 L 750 260" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- PLIC Claim -->
  <rect x="650" y="260" width="200" height="40" fill="#ffffff" stroke="#0f2b5b" stroke-width="2" rx="5" />
  <text x="750" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Read PLIC Claim ID</text>

  <path d="M 750 300 L 750 330" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Vector Table -->
  <rect x="650" y="330" width="200" height="40" fill="#ffffff" stroke="#0f2b5b" stroke-width="2" rx="5" />
  <text x="750" y="355" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Vector_Table[Claim]</text>

  <path d="M 750 370 L 750 400" fill="none" stroke="#0f2b5b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Handler -->
  <rect x="650" y="400" width="200" height="60" fill="#eef2ff" stroke="#0f2b5b" stroke-width="2" rx="5" />
  <text x="750" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">irq_dma_done</text>
  <text x="750" y="440" font-family="Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Set SRAM FLAG_DONE = 1</text>

  <!-- ================= CONNECTING LINES ================= -->

  <!-- Cross-thread sync -->
  <path d="M 650 430 L 330 280" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)" />
  <path d="M 650 430 L 330 430" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)" />
  
  <rect x="420" y="340" width="140" height="30" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" />
  <text x="490" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle">Unblocks Main Loop</text>

</svg>
