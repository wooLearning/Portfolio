<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900">
  <defs>
    <marker id="arrow" orient="auto" markerWidth="7" markerHeight="7" refX="6" refY="3.5">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#000000"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #000; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #000; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #000; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9.5px; fill: #000; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.5; }
      .thinbox { fill: #fff; stroke: #000; stroke-width: 1.2; }
      .line { fill: none; stroke: #000; stroke-width: 1.4; }
      .thin { fill: none; stroke: #000; stroke-width: 1.1; }
      .dash { fill: none; stroke: #000; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .dbl { fill: none; stroke: #000; stroke-width: 1.4; marker-start: url(#arrow); marker-end: url(#arrow); }
      .arr { fill: none; stroke: #000; stroke-width: 1.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="900" fill="#ffffff"/>
  <text x="550" y="32" class="title" text-anchor="middle">Figure 1. RISC-V AXI SoC performance line block diagram</text>
  <rect x="20" y="42" width="1060" height="820" class="box"/>

  <!-- Core -->
  <rect x="145" y="100" width="280" height="300" rx="14" class="box"/>
  <text x="285" y="130" class="label" text-anchor="middle">RV32 Pipeline Core</text>

  <rect x="170" y="154" width="40" height="40" class="thinbox"/>
  <text x="190" y="179" class="label" text-anchor="middle">IF</text>
  <rect x="220" y="154" width="40" height="40" class="thinbox"/>
  <text x="240" y="179" class="label" text-anchor="middle">ID</text>
  <rect x="270" y="154" width="40" height="40" class="thinbox"/>
  <text x="290" y="179" class="label" text-anchor="middle">EX</text>
  <rect x="320" y="154" width="40" height="40" class="thinbox"/>
  <text x="340" y="179" class="label" text-anchor="middle">MEM</text>
  <rect x="370" y="154" width="40" height="40" class="thinbox"/>
  <text x="390" y="179" class="label" text-anchor="middle">WB</text>

  <rect x="190" y="218" width="70" height="38" class="thinbox"/>
  <text x="225" y="242" class="label" text-anchor="middle">RegFile</text>
  <rect x="300" y="218" width="70" height="38" class="thinbox"/>
  <text x="335" y="242" class="label" text-anchor="middle">CSR File</text>

  <rect x="170" y="292" width="230" height="34" class="thinbox"/>
  <text x="285" y="314" class="label" text-anchor="middle">Hazard &amp; Forwarding Unit</text>
  <path d="M145 360 H425" class="line"/>
  <text x="285" y="383" class="label" text-anchor="middle">Trap Controller</text>

  <!-- ROM / adapter / interconnect -->
  <rect x="465" y="105" width="100" height="60" class="box"/>
  <text x="515" y="129" class="label" text-anchor="middle">ICode ROM</text>
  <text x="515" y="149" class="small" text-anchor="middle">Local Bus</text>
  <path d="M425 132 H465" class="dbl"/>
  <text x="444" y="120" class="tiny" text-anchor="middle">IBus</text>

  <rect x="465" y="210" width="100" height="60" class="box"/>
  <text x="515" y="234" class="label" text-anchor="middle">AXI</text>
  <text x="515" y="253" class="label" text-anchor="middle">Adapter</text>
  <path d="M425 238 H465" class="dbl"/>
  <text x="444" y="226" class="tiny" text-anchor="middle">DBus</text>

  <rect x="610" y="82" width="38" height="330" class="box"/>
  <text x="632" y="250" class="label" text-anchor="middle" transform="rotate(-90 632,250)">AXI-Lite Interconnect</text>
  <path d="M565 240 H610" class="dbl"/>

  <rect x="708" y="128" width="118" height="60" class="box"/>
  <text x="767" y="163" class="label" text-anchor="middle">AXI ROM</text>
  <path d="M648 158 H708" class="dbl"/>

  <rect x="708" y="248" width="118" height="60" class="box"/>
  <text x="767" y="283" class="label" text-anchor="middle">AXI SRAM</text>
  <path d="M648 278 H708" class="dbl"/>
  <path d="M425 374 H455 V278 H708" class="thin"/>
  <text x="456" y="367" class="tiny">IBus SRAM</text>

  <rect x="708" y="368" width="118" height="60" class="box"/>
  <text x="767" y="393" class="label" text-anchor="middle">AXI to APB Bridge</text>
  <path d="M648 398 H708" class="dbl"/>

  <!-- APB bus -->
  <path d="M767 428 V460" class="arr"/>
  <rect x="744" y="462" width="30" height="360" class="box"/>
  <text x="764" y="642" class="label" text-anchor="middle" transform="rotate(-90 764,642)">APB Bus</text>

  <!-- Left APB peripherals -->
  <rect x="570" y="485" width="118" height="50" class="box"/>
  <text x="629" y="516" class="label" text-anchor="middle">Timer</text>
  <path d="M688 510 H744" class="dbl"/>

  <rect x="570" y="575" width="118" height="50" class="box"/>
  <text x="629" y="606" class="label" text-anchor="middle">PLIC</text>
  <path d="M688 600 H744" class="dbl"/>

  <rect x="570" y="665" width="118" height="50" class="box"/>
  <text x="629" y="696" class="label" text-anchor="middle">GPIOA</text>
  <path d="M688 690 H744" class="dbl"/>

  <rect x="570" y="735" width="118" height="50" class="box"/>
  <text x="629" y="766" class="label" text-anchor="middle">GPIOB</text>
  <path d="M688 760 H744" class="dbl"/>

  <rect x="570" y="805" width="118" height="38" class="box"/>
  <text x="629" y="829" class="label" text-anchor="middle">GPIOC</text>
  <path d="M688 824 H744" class="dbl"/>

  <!-- Right APB peripherals -->
  <rect x="812" y="485" width="118" height="50" class="box"/>
  <text x="871" y="516" class="label" text-anchor="middle">SPI</text>
  <path d="M774 510 H812" class="dbl"/>

  <rect x="812" y="575" width="118" height="50" class="box"/>
  <text x="871" y="606" class="label" text-anchor="middle">I2C</text>
  <path d="M774 600 H812" class="dbl"/>

  <rect x="812" y="665" width="118" height="50" class="box"/>
  <text x="871" y="696" class="label" text-anchor="middle">UART</text>
  <path d="M774 690 H812" class="dbl"/>

  <rect x="812" y="735" width="118" height="60" class="box"/>
  <text x="871" y="760" class="label" text-anchor="middle">AXI-Stream</text>
  <text x="871" y="779" class="label" text-anchor="middle">DMA</text>
  <path d="M774 765 H812" class="dbl"/>

  <!-- AXI-Stream data paths -->
  <path d="M930 690 H965 V765 H930" class="dash"/>
  <text x="978" y="725" class="tiny">UART RX Stream</text>
  <path d="M812 765 H792 V510 H812" class="dash"/>
  <text x="788" y="650" class="tiny" text-anchor="middle" transform="rotate(-90 788,650)">DMA TX Stream</text>

  <!-- External pins -->
  <path d="M20 690 H570" class="line"/>
  <path d="M530 690 H570" class="dbl"/>
  <text x="520" y="682" class="tiny" text-anchor="end">PA[15:0] (iSw, oLed)</text>

  <path d="M20 760 H570" class="line"/>
  <path d="M530 760 H570" class="dbl"/>
  <text x="520" y="752" class="tiny" text-anchor="end">PB[15:0] (ioGpioB)</text>

  <path d="M20 824 H570" class="line"/>
  <path d="M530 824 H570" class="dbl"/>
  <text x="520" y="816" class="tiny" text-anchor="end">PC[3:0] (iBtn)</text>

  <path d="M930 510 H1000" class="dbl"/>
  <text x="1012" y="514" class="tiny">SPI (MISO, MOSI, SCK, CS)</text>
  <path d="M930 600 H1000" class="dbl"/>
  <text x="1012" y="604" class="tiny">I2C (SDA, SCL)</text>
  <path d="M930 690 H1000" class="dbl"/>
  <text x="1012" y="694" class="tiny">UART (RX, TX)</text>

  <!-- IRQs -->
  <path d="M570 510 H330 V400" class="arr"/>
  <path d="M570 600 H370 V400" class="arr"/>
  <path d="M812 765 C720 765 700 610 688 600" class="dash"/>
  <text x="704" y="746" class="tiny">DMA done/error IRQ</text>

  <!-- Memory map hints -->
  <text x="767" y="207" class="tiny" text-anchor="middle">0x0000_0000</text>
  <text x="767" y="327" class="tiny" text-anchor="middle">0x2000_0000 / RAM app 0x2000_1000</text>
  <text x="767" y="447" class="tiny" text-anchor="middle">APB window 0x4000_0000</text>
</svg>
