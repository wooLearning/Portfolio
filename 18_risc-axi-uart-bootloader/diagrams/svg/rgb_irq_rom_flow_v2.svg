<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" style="background:#ffffff; font-family: 'Noto Sans KR', Arial, sans-serif;">
  <defs>
    <style>
      .line { fill: none; stroke: #0f172a; stroke-width: 1.5; stroke-linejoin: round; }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .dash-box { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 10,6; }
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; rx: 4; }
      .box-highlight { fill: #f1f5f9; stroke: #0f2b5b; stroke-width: 2; rx: 4; }
      .decision { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; stroke-linejoin: round; }
      .text-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text-bold { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 13px; fill: #334155; }
      .text-small { font-size: 12px; font-weight: 600; fill: #64748b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <text x="470" y="30" class="text-title" text-anchor="middle">Figure 7. UART-to-SPI DMA RAM App Flowchart</text>

  <!-- Main Thread -->
  <rect x="24" y="52" width="410" height="420" class="dash-box"/>
  <text x="229" y="80" class="text-bold" text-anchor="middle">RAM App Main / SRAM Flag Wait</text>

  <rect x="84" y="104" width="290" height="38" class="box"/>
  <text x="229" y="122" class="text-bold" text-anchor="middle">Init: PLIC enable, mtvec=trap_entry</text>
  <text x="229" y="136" class="text-small" text-anchor="middle">flags clear, DMA length = IMAGE_BYTES</text>

  <path d="M 229 142 L 229 166" class="line" marker-end="url(#arrow)"/>
  <rect x="84" y="166" width="290" height="38" class="box"/>
  <text x="229" y="190" class="text-bold" text-anchor="middle">RX phase: DMA_CTRL = 3</text>

  <path d="M 229 204 L 229 230" class="line" marker-end="url(#arrow)"/>
  <polygon points="229,230 324,253 229,276 134,253" class="decision"/>
  <text x="229" y="250" class="text-bold" text-anchor="middle">FLAG_DONE?</text>
  <text x="229" y="264" class="text-small" text-anchor="middle">or FLAG_ERROR</text>

  <path d="M 134 253 L 72 253 L 72 218 L 229 218" class="line" marker-end="url(#arrow)"/>
  <text x="84" y="247" class="text-small">No</text>
  <text x="245" y="294" class="text-small">Yes (Done)</text>

  <path d="M 229 276 L 229 304" class="line" marker-end="url(#arrow)"/>
  <rect x="84" y="304" width="290" height="38" class="box"/>
  <text x="229" y="328" class="text-bold" text-anchor="middle">TX phase: DMA_CTRL = 7</text>

  <path d="M 229 342 L 229 366" class="line" marker-end="url(#arrow)"/>
  <polygon points="229,366 324,389 229,412 134,389" class="decision"/>
  <text x="229" y="386" class="text-bold" text-anchor="middle">FLAG_DONE?</text>
  <text x="229" y="400" class="text-small" text-anchor="middle">or FLAG_ERROR</text>
  
  <path d="M 134 389 L 72 389 L 72 354 L 229 354" class="line" marker-end="url(#arrow)"/>
  <text x="84" y="383" class="text-small">No</text>

  <path d="M 229 412 L 229 442 L 46 442 L 46 123 L 84 123" class="line" marker-end="url(#arrow)"/>
  <text x="246" y="435" class="text-small">Yes (Next frame)</text>


  <!-- Interrupt Context -->
  <rect x="506" y="52" width="410" height="420" class="dash-box"/>
  <text x="711" y="80" class="text-bold" text-anchor="middle">Interrupt Context / PLIC + SW Vector Table</text>

  <rect x="571" y="101" width="280" height="36" class="box-highlight"/>
  <text x="711" y="123" class="text-bold" text-anchor="middle">Hardware IRQ: DMA_DONE / ERROR</text>

  <path d="M 711 137 L 711 158" class="line" marker-end="url(#arrow)"/>
  <rect x="571" y="158" width="280" height="34" class="box"/>
  <text x="711" y="180" class="text-bold" text-anchor="middle">mtvec direct trap entry</text>

  <path d="M 711 192 L 711 213" class="line" marker-end="url(#arrow)"/>
  <rect x="571" y="213" width="280" height="34" class="box"/>
  <text x="711" y="235" class="text-bold" text-anchor="middle">Read PLIC_CLAIM: ID 6 or 7</text>

  <path d="M 711 247 L 711 268" class="line" marker-end="url(#arrow)"/>
  <rect x="571" y="268" width="280" height="34" class="box"/>
  <text x="711" y="290" class="text-bold" text-anchor="middle">jalr irq_vector_table[claim]</text>

  <path d="M 711 302 L 637 325" class="line" marker-end="url(#arrow)"/>
  <path d="M 711 302 L 785 325" class="line" marker-end="url(#arrow)"/>

  <rect x="532" y="325" width="210" height="58" class="box"/>
  <text x="637" y="346" class="text-bold" text-anchor="middle">ID6 irq_dma_done</text>
  <text x="637" y="362" class="text-small" text-anchor="middle">SRAM FLAG_DONE = 1</text>
  <text x="637" y="377" class="text-small" text-anchor="middle">DMA_CLEAR = DONE sticky</text>

  <rect x="762" y="325" width="126" height="58" class="box"/>
  <text x="825" y="346" class="text-bold" text-anchor="middle">ID7 error</text>
  <text x="825" y="362" class="text-small" text-anchor="middle">FLAG_ERROR = 1</text>
  <text x="825" y="377" class="text-small" text-anchor="middle">clear sticky</text>

  <path d="M 637 383 L 637 405 L 711 405" class="line" />
  <path d="M 825 383 L 825 405 L 711 405" class="line" />
  <path d="M 711 405 L 711 415" class="line" marker-end="url(#arrow)"/>
  
  <rect x="571" y="415" width="280" height="30" class="box"/>
  <text x="711" y="435" class="text-bold" text-anchor="middle">PLIC_COMPLETE, restore regs, mret</text>

  <!-- Cross-Domain Routing (Flags) -->
  <path d="M 532 345 L 480 345 L 480 253 L 324 253" class="dashed" marker-end="url(#arrow)"/>
  <path d="M 532 365 L 480 365 L 480 389 L 324 389" class="dashed" marker-end="url(#arrow)"/>
  
  <rect x="410" y="300" width="140" height="26" class="box" />
  <text x="480" y="317" class="text-small" text-anchor="middle">IRQ Sets SRAM Flags</text>

</svg>
