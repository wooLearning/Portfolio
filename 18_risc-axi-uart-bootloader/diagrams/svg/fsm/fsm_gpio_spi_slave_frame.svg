      <path d="M 270 420 Q 457.4438966627751 300.53960654729576 600 130" class="edge" marker-end="url(#arrow)"/>
      <text x="435" y="247" class="edge-label" text-anchor="middle"><tspan x="435" dy="0">high byte received</tspan></text>
  
      <g class="state" transform="translate(600, 130)">
        <ellipse cx="0" cy="0" rx="140" ry="34"/>
        <text text-anchor="middle" dominant-baseline="middle"><tspan x="0" dy="0">S_WAIT_HEADER</tspan></text>
      </g>

      <g class="state" transform="translate(930, 420)">
        <ellipse cx="0" cy="0" rx="120" ry="34"/>
        <text text-anchor="middle" dominant-baseline="middle"><tspan x="0" dy="0">S_RECV_LOW</tspan></text>
      </g>

      <g class="state" transform="translate(270, 420)">
