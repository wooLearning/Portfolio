<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/></marker><style>.title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#111827}.subtitle{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#4b5563}.state ellipse{fill:#fff;stroke:#333;stroke-width:2.4}.state text{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;fill:#111827}.edge{fill:none;stroke:#333;stroke-width:2.2}.edge-label{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#111827}.note{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#374151}.frame{fill:#fff;stroke:#d1d5db;stroke-width:1.2}.callout rect{fill:#f9fafb;stroke:#9ca3af;stroke-width:1.4;stroke-dasharray:5 5}.callout text{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#374151}</style></defs>
<rect class="frame" x="1" y="1" width="1198" height="758"/>
<text x="600" y="44" text-anchor="middle" class="title">APB AXI-Stream DMA FSM</text>
<text x="600" y="70" text-anchor="middle" class="subtitle">Project/risc_axi/src/bus/apb/ApbAxiStreamDma.sv</text>
<path d="M 600 190 Q 545 350 600 510" class="edge" marker-end="url(#arrow)"/><text x="745" y="340" class="edge-label" text-anchor="middle"><tspan x="745" dy="0">START &amp;&amp; range OK</tspan></text>
<path d="M 600 510 Q 655 350 600 190" class="edge" marker-end="url(#arrow)"/><text x="415" y="340" class="edge-label" text-anchor="middle"><tspan x="415" dy="0">last byte handshake: set</tspan><tspan x="415" dy="16">DONE sticky</tspan></text>
<path d="M 600 510 Q 520 350 600 190" class="edge" marker-end="url(#arrow)"/><text x="600" y="690" class="edge-label" text-anchor="middle"><tspan x="600" dy="0">early TLAST or bad range: set</tspan><tspan x="600" dy="16">ERROR sticky</tspan></text>
<g class="callout"><rect x="190" y="380" width="280" height="74" rx="8"/><text x="330" y="404" text-anchor="middle"><tspan x="330" dy="0">RX mode: S_AXIS handshake writes</tspan><tspan x="330" dy="16">bytes into internal buffer</tspan></text></g>
<g class="callout"><rect x="730" y="380" width="290" height="74" rx="8"/><text x="875" y="404" text-anchor="middle"><tspan x="875" dy="0">TX mode: internal buffer replays</tspan><tspan x="875" dy="16">bytes through M_AXIS</tspan></text></g>
<g class="state" transform="translate(600, 190)"><ellipse cx="0" cy="0" rx="120" ry="44"/><text text-anchor="middle" dominant-baseline="middle"><tspan x="0" dy="0">S_IDLE</tspan></text></g>
<g class="state" transform="translate(600, 510)"><ellipse cx="0" cy="0" rx="120" ry="44"/><text text-anchor="middle" dominant-baseline="middle"><tspan x="0" dy="0">S_RUN</tspan></text></g>

<text x="600" y="732" text-anchor="middle" class="note">Only S_IDLE and S_RUN are FSM states. DONE/ERROR are sticky status bits raised during the return to IDLE.</text>
</svg>
