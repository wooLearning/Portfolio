<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #4b5563; }
      .state ellipse { fill: #ffffff; stroke: #333333; stroke-width: 2.4; }
      .state text { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .edge { fill: none; stroke: #333333; stroke-width: 2.2; }
      .edge-label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111827; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #374151; }
      .frame { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    </style>
  </defs>
  <rect class="frame" x="1" y="1" width="1198" height="758"/>
  <text x="600" y="44" text-anchor="middle" class="title">PLIC Gateway FSM</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">Project/risc_axi/src/bus/apb/ApbPlicGateway.sv</text>
  
      <path d="M 600 180 Q 546 340 600 500" class="edge" marker-end="url(#arrow)"/>
      <text x="730" y="330" class="edge-label" text-anchor="middle"><tspan x="730" dy="0">raw IRQ: emit request</tspan><tspan x="730" dy="16">pulse</tspan></text>

      <path d="M 600 500 Q 654 340 600 180" class="edge" marker-end="url(#arrow)"/>
      <text x="455" y="330" class="edge-label" text-anchor="middle"><tspan x="455" dy="0">complete &amp;&amp; raw IRQ low</tspan></text>

      <path d="M 600 500 Q 600 500 600 500" class="edge" marker-end="url(#arrow)"/>
      <text x="600" y="650" class="edge-label" text-anchor="middle"><tspan x="600" dy="0">complete &amp;&amp; raw IRQ</tspan><tspan x="600" dy="16">high: reissue</tspan></text>
  
      <g class="state" transform="translate(600, 180)">
        <ellipse cx="0" cy="0" rx="120" ry="42"/>
        <text text-anchor="middle" dominant-baseline="middle"><tspan x="0" dy="0">GW_IDLE</tspan></text>
      </g>

      <g class="state" transform="translate(600, 500)">
        <ellipse cx="0" cy="0" rx="135" ry="42"/>
        <text text-anchor="middle" dominant-baseline="middle"><tspan x="0" dy="0">GW_BLOCKED</tspan></text>
      </g>
  <text x="600" y="732" text-anchor="middle" class="note">One identical 2-state gateway instance exists per interrupt source.</text>
</svg>
