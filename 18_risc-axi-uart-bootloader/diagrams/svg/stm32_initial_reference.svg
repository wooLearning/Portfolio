<svg xmlns="http://www.w3.org/2000/svg" width="940" height="468" viewBox="0 0 940 468">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f2b5b"/>
    </marker>
    <style>
      .title { font: 700 22px 'Noto Sans KR', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 12px 'Noto Sans KR', Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .bus { fill: #eef2ff; stroke: #0f2b5b; stroke-width: 1.8; rx: 8; }
      .ref { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
      .changed { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.2; rx: 10; }
      .label { font: 700 14px 'Noto Sans KR', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 11px 'Noto Sans KR', Arial, sans-serif; fill: #334155; }
      .tag { font: 700 10px 'Noto Sans KR', Arial, sans-serif; fill: #0f2b5b; }
      .line { stroke: #0f2b5b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="940" height="468" fill="#ffffff"/>
  <text x="24" y="34" class="title">Initial MCU Concept Reference</text>
  <text x="24" y="56" class="sub">STM32F103 datasheet의 performance line block diagram을 보고 MCU 구성 요소와 bus/peripheral 배치를 먼저 이해했다.</text>

  <rect x="24" y="78" width="432" height="342" class="ref"/>
  <text x="42" y="104" class="tag">REFERENCE STRUCTURE</text>
  <rect x="63" y="130" width="120" height="58" class="box"/>
  <text x="90" y="154" class="label">Cortex-M3</text>
  <text x="79" y="174" class="small">CPU + NVIC</text>

  <rect x="266" y="130" width="120" height="58" class="box"/>
  <text x="301" y="154" class="label">Memory</text>
  <text x="284" y="174" class="small">Flash / SRAM</text>

  <rect x="194" y="218" width="80" height="122" class="bus"/>
  <text x="211" y="274" class="label">AHB</text>
  <text x="202" y="294" class="small">BusMatrix</text>

  <rect x="54" y="244" width="108" height="52" class="box"/>
  <text x="84" y="265" class="label">DMA</text>
  <text x="70" y="284" class="small">7 channels</text>

  <rect x="310" y="224" width="105" height="43" class="box"/>
  <text x="342" y="250" class="label">APB1</text>
  <rect x="310" y="288" width="105" height="43" class="box"/>
  <text x="342" y="314" class="label">APB2</text>

  <rect x="69" y="356" width="342" height="40" class="box"/>
  <text x="112" y="381" class="label">GPIO / UART / SPI / I2C / Timer peripherals</text>

  <path d="M183 159 L258 159" class="line"/>
  <path d="M326 188 L273 238" class="line"/>
  <path d="M162 270 L186 270" class="line"/>
  <path d="M274 246 L302 246" class="line"/>
  <path d="M274 309 L302 309" class="line"/>
  <path d="M234 340 L234 349" class="line"/>

  <rect x="486" y="78" width="430" height="342" class="changed"/>
  <text x="504" y="104" class="tag">WHAT WE CHANGED</text>
  <rect x="526" y="132" width="150" height="60" class="box"/>
  <text x="559" y="157" class="label">Custom RV32I</text>
  <text x="555" y="176" class="small">instead of Cortex-M3</text>

  <rect x="730" y="132" width="136" height="60" class="box"/>
  <text x="759" y="157" class="label">Local ROM</text>
  <text x="750" y="176" class="small">IBus fast fetch path</text>

  <rect x="560" y="224" width="116" height="64" class="bus"/>
  <text x="581" y="250" class="label">AXI-Lite</text>
  <text x="580" y="269" class="small">control fabric</text>

  <rect x="724" y="224" width="112" height="64" class="box"/>
  <text x="751" y="250" class="label">APB</text>
  <text x="738" y="269" class="small">custom slaves</text>

  <rect x="526" y="330" width="146" height="48" class="box"/>
  <text x="549" y="350" class="label">AXI-Stream DMA</text>
  <text x="547" y="367" class="small">RGB payload path</text>

  <rect x="704" y="330" width="162" height="48" class="box"/>
  <text x="725" y="350" class="label">UART / SPI / GPIO</text>
  <text x="724" y="367" class="small">rewritten peripheral core</text>

  <path d="M676 162 L722 162" class="line"/>
  <path d="M618 192 L618 216" class="line"/>
  <path d="M676 256 L716 256" class="line"/>
  <path d="M618 288 L604 322" class="line"/>
  <path d="M672 354 L696 354" class="line"/>

  <text x="502" y="405" class="sub">Reference was the MCU organization; the actual core, bus, DMA, and peripheral logic were redesigned.</text>
</svg>
