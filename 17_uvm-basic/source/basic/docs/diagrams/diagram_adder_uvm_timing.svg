<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" style="background:#ffffff; font-family:'Noto Sans KR', Arial, sans-serif;">
  <defs>
    <style>
      .frame { fill:#ffffff; stroke:#d8d8d8; stroke-width:1.4; }
      .panel { fill:none; stroke:#c7c7c7; stroke-width:1.8; stroke-dasharray:10 6; rx:8; }
      .head { fill:#ffffff; stroke:#222222; stroke-width:1.4; rx:5; }
      .head-hi { fill:#ffffff; stroke:#333333; stroke-width:2; rx:5; }
      .life { stroke:#c7c7c7; stroke-width:1.35; stroke-dasharray:6 5; }
      .line { fill:none; stroke:#222222; stroke-width:1.55; marker-end:url(#arrow); }
      .self { fill:none; stroke:#222222; stroke-width:1.45; stroke-linejoin:round; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#666666; stroke-width:1.35; stroke-dasharray:6 5; marker-end:url(#arrowGray); }
      .wave { fill:none; stroke:#222222; stroke-width:1.45; stroke-linejoin:round; }
      .bus { fill:none; stroke:#222222; stroke-width:2.6; marker-end:url(#arrow); }
      .title { font-size:22px; font-weight:800; fill:#222222; }
      .subtitle { font-size:13px; fill:#555555; font-weight:500; }
      .label { font-size:13px; font-weight:800; fill:#222222; }
      .msg { font-size:11.5px; font-weight:600; fill:#444444; }
      .note { font-size:12px; font-weight:600; fill:#666666; }
      .lane-title { font-size:12px; font-weight:800; fill:#333333; letter-spacing:.4px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#222222"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="18" y="18" width="1064" height="584" class="frame"/>
  <text x="550" y="48" class="title" text-anchor="middle">Figure 3. Adder UVM Sequence and Combinational Timing</text>
  <text x="550" y="70" class="subtitle" text-anchor="middle">The monitor samples after #1 so the combinational output has settled before scoreboard comparison.</text>

  <rect x="48" y="96" width="1004" height="302" class="panel"/>
  <text x="68" y="122" class="lane-title">LIFELINE SEQUENCE</text>

  <rect x="74" y="142" width="112" height="40" class="head-hi"/>
  <text x="130" y="167" class="label" text-anchor="middle">sequence</text>
  <rect x="238" y="142" width="104" height="40" class="head-hi"/>
  <text x="290" y="167" class="label" text-anchor="middle">driver</text>
  <rect x="400" y="142" width="104" height="40" class="head-hi"/>
  <text x="452" y="167" class="label" text-anchor="middle">adder</text>
  <rect x="562" y="142" width="104" height="40" class="head"/>
  <text x="614" y="167" class="label" text-anchor="middle">monitor</text>
  <rect x="724" y="142" width="126" height="40" class="head"/>
  <text x="787" y="167" class="label" text-anchor="middle">scoreboard</text>
  <rect x="908" y="142" width="104" height="40" class="head"/>
  <text x="960" y="167" class="label" text-anchor="middle">coverage</text>

  <line x1="130" y1="182" x2="130" y2="370" class="life"/>
  <line x1="290" y1="182" x2="290" y2="370" class="life"/>
  <line x1="452" y1="182" x2="452" y2="370" class="life"/>
  <line x1="614" y1="182" x2="614" y2="370" class="life"/>
  <line x1="787" y1="182" x2="787" y2="370" class="life"/>
  <line x1="960" y1="182" x2="960" y2="370" class="life"/>

  <path d="M130 215 L290 215" class="line"/>
  <text x="210" y="204" class="msg" text-anchor="middle">directed item: 0 + 0</text>

  <path d="M290 250 L452 250" class="bus"/>
  <text x="371" y="239" class="msg" text-anchor="middle">drive iA, iB</text>

  <path d="M614 285 L452 285" class="dash"/>
  <text x="533" y="274" class="msg" text-anchor="middle">sample after #1</text>

  <path d="M614 320 L787 320" class="line"/>
  <text x="700" y="309" class="msg" text-anchor="middle">iA, iB, oY</text>

  <path d="M787 334 C830 334 830 360 787 360" class="self"/>
  <text x="848" y="352" class="msg" text-anchor="middle">expected = iA + iB</text>

  <path d="M614 350 L960 350" class="line"/>
  <text x="787" y="341" class="msg" text-anchor="middle">sample bins: operand / carry</text>

  <path d="M130 382 L290 382" class="line"/>
  <text x="210" y="371" class="msg" text-anchor="middle">all1 + all1, then random x50</text>

  <rect x="86" y="430" width="928" height="120" class="head"/>
  <text x="550" y="456" class="label" text-anchor="middle">Combinational settle window</text>
  <line x1="170" y1="490" x2="940" y2="490" stroke="#d8d8d8" stroke-width="1"/>
  <line x1="270" y1="472" x2="270" y2="532" stroke="#c7c7c7" stroke-width="1"/>
  <line x1="555" y1="472" x2="555" y2="532" stroke="#c7c7c7" stroke-width="1"/>
  <line x1="735" y1="472" x2="735" y2="532" stroke="#c7c7c7" stroke-width="1"/>
  <text x="270" y="471" class="note" text-anchor="middle">T</text>
  <text x="555" y="471" class="note" text-anchor="middle">T + delta</text>
  <text x="735" y="471" class="note" text-anchor="middle">T + #1</text>
  <text x="120" y="501" class="msg">iA/iB</text>
  <path d="M170 500 L265 500 L270 486 L550 486 L555 500 L940 500" class="wave"/>
  <text x="120" y="528" class="msg">oY</text>
  <path d="M170 528 L550 528 L555 514 L730 514 L735 528 L940 528" class="wave"/>
  <text x="790" y="529" class="note">monitor uses settled oY</text>
</svg>
