<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" style="background:#ffffff; font-family:'Noto Sans KR', Arial, sans-serif;">
  <defs>
    <style>
      .frame { fill:#ffffff; stroke:#d8d8d8; stroke-width:1.4; }
      .phase { fill:none; stroke:#c7c7c7; stroke-width:1.8; stroke-dasharray:10 6; rx:8; }
      .head { fill:#ffffff; stroke:#222222; stroke-width:1.4; rx:5; }
      .head-hi { fill:#ffffff; stroke:#333333; stroke-width:2; rx:5; }
      .life { stroke:#c7c7c7; stroke-width:1.4; stroke-dasharray:6 5; }
      .line { fill:none; stroke:#222222; stroke-width:1.55; marker-end:url(#arrow); }
      .return { fill:none; stroke:#666666; stroke-width:1.35; stroke-dasharray:6 5; marker-end:url(#arrowGray); }
      .title { font-size:22px; font-weight:800; fill:#222222; }
      .subtitle { font-size:13px; fill:#555555; font-weight:500; }
      .phase-title { font-size:12px; font-weight:800; fill:#333333; letter-spacing:.4px; }
      .label { font-size:13px; font-weight:800; fill:#222222; }
      .msg { font-size:11.5px; font-weight:600; fill:#444444; }
      .note { font-size:12px; font-weight:600; fill:#666666; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#222222"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="18" y="18" width="1064" height="520" class="frame"/>
  <text x="550" y="48" class="title" text-anchor="middle">Figure 2. Common UVM Transaction Sequence</text>
  <text x="550" y="70" class="subtitle" text-anchor="middle">Stimulus path, DUT boundary, and analysis path shown as lifelines instead of process boxes.</text>

  <rect x="54" y="92" width="500" height="406" class="phase"/>
  <text x="72" y="118" class="phase-title">STIMULUS PATH</text>
  <rect x="572" y="92" width="162" height="406" class="phase"/>
  <text x="590" y="118" class="phase-title">PIN-LEVEL</text>
  <rect x="752" y="92" width="294" height="406" class="phase"/>
  <text x="770" y="118" class="phase-title">ANALYSIS PATH</text>

  <g id="heads">
    <rect x="75" y="135" width="102" height="42" class="head-hi"/>
    <text x="126" y="161" class="label" text-anchor="middle">*_test</text>
    <rect x="215" y="135" width="112" height="42" class="head"/>
    <text x="271" y="161" class="label" text-anchor="middle">*_sequence</text>
    <rect x="365" y="135" width="112" height="42" class="head"/>
    <text x="421" y="161" class="label" text-anchor="middle">sequencer</text>
    <rect x="510" y="135" width="100" height="42" class="head-hi"/>
    <text x="560" y="161" class="label" text-anchor="middle">driver</text>
    <rect x="630" y="135" width="92" height="42" class="head-hi"/>
    <text x="676" y="161" class="label" text-anchor="middle">DUT</text>
    <rect x="778" y="135" width="104" height="42" class="head"/>
    <text x="830" y="161" class="label" text-anchor="middle">monitor</text>
    <rect x="912" y="135" width="112" height="42" class="head"/>
    <text x="968" y="154" class="label" text-anchor="middle">scoreboard</text>
    <text x="968" y="169" class="label" text-anchor="middle">coverage</text>
  </g>

  <g id="lifelines">
    <line x1="126" y1="177" x2="126" y2="466" class="life"/>
    <line x1="271" y1="177" x2="271" y2="466" class="life"/>
    <line x1="421" y1="177" x2="421" y2="466" class="life"/>
    <line x1="560" y1="177" x2="560" y2="466" class="life"/>
    <line x1="676" y1="177" x2="676" y2="466" class="life"/>
    <line x1="830" y1="177" x2="830" y2="466" class="life"/>
    <line x1="968" y1="177" x2="968" y2="466" class="life"/>
  </g>

  <path d="M126 216 L271 216" class="line"/>
  <text x="198" y="205" class="msg" text-anchor="middle">raise objection, start sequence</text>

  <path d="M271 258 L421 258" class="line"/>
  <text x="346" y="247" class="msg" text-anchor="middle">create / randomize seq_item</text>

  <path d="M421 300 L560 300" class="line"/>
  <text x="490" y="289" class="msg" text-anchor="middle">get_next_item</text>

  <path d="M560 342 L676 342" class="line"/>
  <text x="618" y="331" class="msg" text-anchor="middle">drive pins via interface</text>

  <path d="M676 384 L830 384" class="line"/>
  <text x="753" y="373" class="msg" text-anchor="middle">signals / status / data</text>

  <path d="M830 426 L968 426" class="line"/>
  <text x="899" y="415" class="msg" text-anchor="middle">analysis transaction</text>

  <path d="M560 460 L421 460" class="return"/>
  <text x="490" y="449" class="msg" text-anchor="middle">item_done</text>

  <text x="550" y="518" class="note" text-anchor="middle">Adder, RAM, and FIFO keep this topology; only timing, fields, reference model, and coverage bins differ.</text>
</svg>
